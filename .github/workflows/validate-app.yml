name: Validate application

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend
        run: |
          node --test tests/*.test.mjs
          node --input-type=module --check < demo.js
      - name: Validate PHP syntax
        run: |
          php -l index.php
          find api bin -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Validate server rules
        run: php tests/backend-rules.php
