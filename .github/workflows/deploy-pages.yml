name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate demo
        run: |
          node --test tests/*.test.mjs
          node --input-type=module --check < demo.js
      - name: Prepare static demonstration only
        run: |
          mkdir pages-demo
          cp index.html teste.html demo.css demo.js demo-core.mjs server-client.mjs pages-demo/
          cp -r assets pages-demo/assets
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-demo
      - id: deployment
        uses: actions/deploy-pages@v4
